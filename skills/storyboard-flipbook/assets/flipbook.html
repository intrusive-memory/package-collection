<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg:#14110f; --panel:#1e1a17; --ink:#efe6da; --dim:#9c8f80; --accent:#d9a441; --line:#3a322b; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif;
         display:flex; flex-direction:column; }
  header { display:flex; align-items:baseline; gap:12px; padding:14px 20px 8px; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  header span { color:var(--dim); font-size:13px; }
  header { border-bottom:1px solid var(--line); }
  /* Overview, detail, panel: the same three panes as a macOS document app. */
  .app { flex:1; min-height:0; display:grid; grid-template-columns:210px minmax(0,1fr) 300px; }
  .sorter { overflow-y:auto; padding:10px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .thumb { display:block; width:100%; padding:4px; text-align:left; background:none; border:2px solid transparent; border-radius:7px; color:var(--dim); font-size:11px; }
  .thumb:hover { background:var(--bg); border-color:transparent; }
  .thumb.on, .thumb.on:hover { border-color:var(--accent); color:var(--ink); }
  .thumb img, .thumb .blank { display:block; width:100%; aspect-ratio:__ASPECT__; object-fit:cover; border-radius:3px; background:#000; }
  .thumb .label { display:flex; gap:5px; margin-top:3px; align-items:baseline; }
  .thumb .num { flex:none; font-variant-numeric:tabular-nums; }
  .thumb .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .thumb .flag { flex:none; width:7px; height:7px; border-radius:50%; background:var(--accent); align-self:center; display:none; }
  .thumb.has-note .flag { display:block; }
  .detail { min-width:0; min-height:0; display:flex; flex-direction:column; gap:10px; padding:14px 16px; }
  .stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  .frame { position:relative; width:100%; max-height:100%; aspect-ratio:__ASPECT__; cursor:pointer;
           background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .frame img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0;
               transition:opacity .35s ease; }
  .frame img.on, .frame .missing.on { opacity:1; }
  .frame .missing { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                    color:var(--dim); font-size:20px; opacity:0; transition:opacity .35s ease; }
  .badge { position:absolute; top:12px; left:12px; background:rgba(0,0,0,.6); border:1px solid var(--line);
           border-radius:999px; padding:3px 11px; font-size:13px; font-variant-numeric:tabular-nums; }
  .note { position:absolute; top:12px; right:12px; background:var(--accent); color:#1b1408; border-radius:999px;
          padding:3px 11px; font-size:12px; font-weight:600; display:none; }
  .note.on { display:block; }
  .panel { min-height:0; display:flex; flex-direction:column; gap:8px; padding:14px; background:var(--panel); border-left:1px solid var(--line); }
  .panel h2 { margin:0; font-size:12px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  .caption b { display:block; font-size:16px; margin-bottom:4px; }
  .caption span { color:var(--dim); font-size:13px; }
  .controls { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .controls-middle { display:flex; align-items:center; justify-content:center; gap:10px; }
  button:disabled, button:disabled:hover { opacity:.35; cursor:default; border-color:var(--line); }
  button { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px;
           padding:7px 14px; font:inherit; font-size:14px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .notes { flex:1; min-height:0; display:flex; flex-direction:column; margin-top:10px; }
  .notes label { display:flex; justify-content:space-between; gap:12px; font-size:12px; color:var(--accent); font-weight:600; margin-bottom:4px; }
  #status { color:var(--dim); font-weight:400; }
  #status.warn { color:#e2654f; font-weight:600; }
  .notes textarea { flex:1; width:100%; min-height:120px; resize:none; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; }
  .notes textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .hint { text-align:center; color:var(--dim); font-size:11px; }
  @media (max-width:900px) {
    html, body { height:auto; }
    .app { display:flex; flex-direction:column; }
    .sorter { flex-direction:row; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); }
    .thumb { flex:0 0 130px; }
    .panel { border-left:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <span>__SUBTITLE__</span>
</header>

<div class="app">
  <nav class="sorter" id="dots" aria-label="Slides"></nav>
  <main class="detail">
    <div class="stage">
      <div class="frame" id="frame" title="Click for the next frame">
        <div class="badge" id="badge"></div>
        <div class="note" id="note"></div>
      </div>
    </div>
    <div class="controls">
      <button id="first" aria-label="First frame">First</button>
      <div class="controls-middle">
        <button id="prev" aria-label="Previous frame">◀ Prev</button>
        <button id="play" aria-pressed="false">Play</button>
        <button id="next" aria-label="Next frame">Next ▶</button>
      </div>
      <button id="last" aria-label="Last frame">Last</button>
    </div>
    <div class="hint">← → to step · space to play or pause · click the picture to advance · Esc leaves the notes box</div>
  </main>
  <aside class="panel" aria-label="Frame details">
    <h2>Frame</h2>
    <div class="caption"><b id="title"></b><span id="text"></span></div>
    <div class="notes">
      <label for="usernote"><span>Notes</span><span id="status" role="status"></span></label>
      <textarea id="usernote" placeholder="Type a note. It saves as you type."></textarea>
    </div>
  </aside>
</div>

<script>
// Written by flipbook.py from the storyboard plan. Files sit next to this page.
const FRAMES = __FRAMES__;
const SECONDS = 3.5;

const frame = document.getElementById("frame"), dots = document.getElementById("dots");
const imgs = FRAMES.map((f, i) => {
  const im = f.file ? new Image() : document.createElement("div");
  if (f.file) { im.src = f.file; im.alt = f.title; } else { im.className = "missing"; im.textContent = f.title; }
  frame.prepend(im);
  const d = document.createElement("button"); d.className = "thumb"; d.setAttribute("aria-label", "Frame " + (i + 1) + ": " + f.title);
  const pic = f.file ? new Image() : document.createElement("div");
  if (f.file) { pic.src = f.file; pic.alt = ""; pic.loading = "lazy"; } else { pic.className = "blank"; }
  const label = document.createElement("div"); label.className = "label";
  const num = document.createElement("span"); num.className = "num"; num.textContent = i + 1;
  const name = document.createElement("span"); name.className = "name"; name.textContent = f.title;
  const flag = document.createElement("span"); flag.className = "flag"; flag.title = "Has notes";
  label.append(num, name, flag); d.append(pic, label);
  d.onclick = () => { stop(); show(i); }; dots.append(d);
  return im;
});
let at = 0, timer = null;

// Notes: saved to notes.json by flipbook_server.py. Opened as a plain file they stay in this browser.
const box = document.getElementById("usernote"), statusEl = document.getElementById("status");
const NOTES_KEY = "notes:" + location.pathname;
let notes = {}, saveTimer = null, dirty = null, onServer = false;
function setStatus(t, warn) { statusEl.textContent = t; statusEl.classList.toggle("warn", !!warn); }
function markDot(id) { const k = FRAMES.findIndex(f => f.id === id); if (k >= 0) dots.children[k].classList.toggle("has-note", !!(notes[id] || "").trim()); }
async function flushNote() {
  clearTimeout(saveTimer);
  if (!dirty) return;
  const { id, note } = dirty; dirty = null;
  if (!onServer) { try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); } catch (e) {} return; }
  try {
    const r = await fetch("/api/notes", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, note }) });
    if (!r.ok) throw new Error(r.status);
    setStatus("Saved");
  } catch (e) { dirty = dirty || { id, note }; setStatus("NOT SAVED: is the flipbook server still running?", true); }
}
async function loadNotes() {
  try {
    const r = await fetch("/api/notes");
    if (!r.ok) throw new Error(r.status);
    const saved = await r.json();
    notes = Object.fromEntries(Object.entries(saved).map(([k, v]) => [k, v.note]));
    onServer = true; setStatus("");
  } catch (e) {
    try { notes = JSON.parse(localStorage.getItem(NOTES_KEY) || "{}"); } catch (e2) {}
    setStatus("Notes stay in this browser only. Run flipbook_server.py to save them to the project.", true);
  }
  FRAMES.forEach(f => markDot(f.id));
  box.value = notes[FRAMES[at].id] || "";
}
box.addEventListener("input", () => {
  const id = FRAMES[at].id;
  notes[id] = box.value; dirty = { id, note: box.value }; markDot(id);
  if (onServer) setStatus("Saving...");
  clearTimeout(saveTimer); saveTimer = setTimeout(flushNote, 400);
});
box.addEventListener("focus", () => stop());
box.addEventListener("blur", flushNote);
addEventListener("pagehide", flushNote);

function show(i) {
  flushNote();
  at = Math.max(0, Math.min(i, FRAMES.length - 1));  // stops at both ends; never wraps
  const atFirst = at === 0, atLast = at === FRAMES.length - 1;
  document.getElementById("first").disabled = document.getElementById("prev").disabled = atFirst;
  document.getElementById("last").disabled = document.getElementById("next").disabled = atLast;
  document.getElementById("play").disabled = atLast;
  if (atLast) stop();
  box.value = notes[FRAMES[at].id] || "";
  imgs.forEach((im, k) => im.classList.toggle("on", k === at));
  [...dots.children].forEach((d, k) => d.classList.toggle("on", k === at));
  dots.children[at].scrollIntoView({ block: "nearest" });
  const f = FRAMES[at];
  document.getElementById("badge").textContent = (at + 1) + " / " + FRAMES.length;
  document.getElementById("title").textContent = f.title;
  document.getElementById("text").textContent = f.text;
  const note = document.getElementById("note");
  note.textContent = f.note || ""; note.classList.toggle("on", !!f.note);
}
const play = document.getElementById("play");
function stop() { clearInterval(timer); timer = null; play.textContent = "Play"; play.setAttribute("aria-pressed", "false"); }
function start() { if (at === FRAMES.length - 1) return; timer = setInterval(() => show(at + 1), SECONDS * 1000); play.textContent = "Pause"; play.setAttribute("aria-pressed", "true"); }
play.onclick = () => timer ? stop() : start();
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("last").onclick = () => { stop(); show(FRAMES.length - 1); };
document.getElementById("prev").onclick = () => { stop(); show(at - 1); };
document.getElementById("next").onclick = () => { stop(); show(at + 1); };
frame.onclick = () => { stop(); show(at + 1); };
document.addEventListener("keydown", e => {
  if (e.target === box) { if (e.key === "Escape") box.blur(); return; }
  if (e.key === "ArrowRight") { stop(); show(at + 1); }
  else if (e.key === "ArrowLeft") { stop(); show(at - 1); }
  else if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); timer ? stop() : start(); }
});
show(0);
loadNotes();
</script>
</body>
</html>
